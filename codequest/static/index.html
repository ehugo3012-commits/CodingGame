<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f1222">
  <title>CodeQuest</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Back" hidden>‹</button>
    <h1 id="page-title">CodeQuest</h1>
    <div class="topbar-stats" id="topbar-stats" aria-live="polite"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><span class="ti">🏠</span><span>Home</span></a>
    <a href="#/learn/python" data-tab="learn"><span class="ti">📚</span><span>Learn</span></a>
    <a href="#/practice" data-tab="practice"><span class="ti">🧩</span><span>Practice</span></a>
    <a href="#/play" data-tab="play"><span class="ti">⌨️</span><span>Code</span></a>
    <a href="#/profile" data-tab="profile"><span class="ti">🏆</span><span>Profile</span></a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
